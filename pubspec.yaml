name: html2md_plus
description: >-
  Converts HTML to Markdown, with CommonMark, GFM tables and custom rules. A
  maintained successor of html2md with independent calls and bug fixes.
version: 2.0.0
repository: https://github.com/bada-labs/html2md_plus
issue_tracker: https://github.com/bada-labs/html2md_plus/issues
topics:
  - html
  - markdown
  - converter

environment:
  sdk: ^3.6.0

dependencies:
  html: ^0.15.4

dev_dependencies:
  html2md: 1.3.2
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
